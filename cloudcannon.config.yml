# Generated by gen_cloudcannon.py — do not edit by hand.
# Maps content/*.json (the build's editable copy) into CloudCannon's editor.
version: latest-v2

# CloudCannon edits and commits only; Cloudflare builds and hosts.
mode: headless
source: site

collections_config:
  content:
    path: content
    glob:
      - '*.json'
    name: Site copy
    icon: edit_note
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
  groups:
    path: content/groups
    glob:
      - '*.json'
      - '!.schema.json'
    name: Group Trips
    icon: groups
    create:
      path: '[relative_base_path]/{slug}.[ext]'
    schemas:
      default:
        path: .schema.json
    preview:
      title: '{title}'
      subtitle: '{dates}'

_inputs: {}

_structures:
  itinerary_day:
    values:
      - value:
          day: ''
          title: ''
          text: ''
          summary: ''
          image: ''
          date: ''
          meals: ''
          overnight: ''
        _inputs:
          day:
            type: text
            label: 'Day (e.g. Day 1)'
          title:
            type: text
            label: 'Day title'
          text:
            type: textarea
            label: 'Day description'
          summary:
            type: textarea
            label: 'Short summary (used in the PDF)'
          image:
            type: image
            label: 'Day photo (optional)'
          date:
            type: text
            label: 'Date (optional, e.g. Sun, March 14)'
          meals:
            type: text
            label: 'Meals included (optional, e.g. B, L, D)'
          overnight:
            type: text
            label: 'Overnight location (optional)'
  vignette:
    values:
      - value:
          title: ''
          text: ''
          image: ''
        _inputs:
          title:
            type: text
            label: 'Vignette headline'
          text:
            type: textarea
            label: 'Vignette copy'
          image:
            type: image
            label: 'Vignette photo'

paths:
  uploads: assets/img

